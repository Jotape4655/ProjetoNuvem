<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Explica Fácil - IA</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f4f8; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:disabled { background: #ccc; }
        #resultado { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; display: none; text-align: left; line-height: 1.4; font-size: 14px; }
        .loading { color: #555; font-style: italic; display: none; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Explica Fácil 🤖</h2>
    <p>Digite um termo difícil que a IA explica:</p>
    <input type="text" id="termo" placeholder="Ex: Computação em Nuvem, CORS, API...">
    <button id="btnExplorar">Explicar agora</button>
    
    <div id="loading" class="loading">Pensando... (isso pode levar uns segundos)</div>
    <div id="resultado"></div>
</div>

<script>
    // 👇 COLOQUE A URL DO SEU NOVO WORKER AQUI ABAIXO (Mantenha as aspas)
    const URL_WORKER = "https://projetoexplicafacil.guaranijoao99.workers.dev/";

    const btn = document.getElementById('btnExplorar');
    const input = document.getElementById('termo');
    const resDiv = document.getElementById('resultado');
    const loadDiv = document.getElementById('loading');

    btn.onclick = async () => {
        const termo = input.value.trim();
        if (!termo) return alert("Digite algo!");

        // Ativa o estado de carregamento na interface
        btn.disabled = true;
        resDiv.style.display = 'none';
        loadDiv.style.display = 'block';

        try {
            const resp = await fetch(URL_WORKER, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ termo })
            });
            const dados = await resp.json();
            
            resDiv.innerText = dados.resposta || dados.erro;
            resDiv.style.display = 'block';
        } catch (e) {
            resDiv.innerText = "Erro ao conectar com a IA.";
            resDiv.style.display = 'block';
        } finally {
            loadDiv.style.display = 'none';
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
